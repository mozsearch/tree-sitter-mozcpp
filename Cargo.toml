[package]
name = "tree-sitter-mozcpp"
description = "tree-sitter-cpp with Mozilla's (Gecko's) macros, for searchfox"
version = "0.1.0"
authors = [
  "Calixte Denizet <cdenizet@mozilla.com>",
  "Andrew Sutherland <asutherland@asutherland.org>",
]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cpp", "mozilla"]
categories = ["parsing"]
repository = "https://github.com/mozsearch/tree-sitter-mozcpp"
edition = "2021"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "src/*",
  "src/tree_sitter/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
